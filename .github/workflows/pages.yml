name: Publish KPL calendar to GitHub Pages

on:
  # A workflow-token push does not trigger another push workflow. Listen for
  # the updater workflow explicitly so every generated ICS is published.
  workflow_run:
    workflows: ["Update KPL calendar"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "kpl-summer-playoffs.ics"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
